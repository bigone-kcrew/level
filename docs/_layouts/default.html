<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · 창업진흥원 근무평정제도 개편 자료</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
:root{
  color-scheme: light;
  --surface-0:#f6f5f2; --surface-1:#fcfcfb; --surface-2:#efeeea;
  --line:#e2e1dc; --line-strong:#cfcec8;
  --text-1:#0b0b0b; --text-2:#52514e; --text-3:#807e78;
  --accent:#2a78d6; --quote:#eb6834;
  --warn-bg:#fdf6e6; --warn-line:#e8d9a8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#242422;
    --line:#333330; --line-strong:#474742;
    --text-1:#ffffff; --text-2:#c3c2b7; --text-3:#918f85;
    --accent:#3987e5; --quote:#d95926;
    --warn-bg:#2a2413; --warn-line:#4d431f;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#242422;
  --line:#333330; --line-strong:#474742;
  --text-1:#ffffff; --text-2:#c3c2b7; --text-3:#918f85;
  --accent:#3987e5; --quote:#d95926;
  --warn-bg:#2a2413; --warn-line:#4d431f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-1);
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:26px 20px 76px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}
.sitename{font-size:12.5px;color:var(--text-3);text-decoration:none}
.sitename:hover{color:var(--text-1)}
button.ghost{background:var(--surface-1);border:1px solid var(--line-strong);color:var(--text-2);
  border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer;font-family:inherit}
button.ghost:hover{color:var(--text-1)}
.docnav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 26px}
.docnav a{display:inline-block;padding:5px 11px;border:1px solid var(--line-strong);border-radius:999px;
  color:var(--text-2);text-decoration:none;font-size:12.5px;background:var(--surface-1)}
.docnav a:hover{color:var(--text-1);border-color:var(--accent)}
.docnav a.on{color:#fff;background:var(--accent);border-color:var(--accent)}
main h1{font-size:25px;line-height:1.3;letter-spacing:-.01em;margin:0 0 22px;padding-bottom:14px;
  border-bottom:1px solid var(--line-strong)}
main h2{font-size:18.5px;margin:38px 0 12px;letter-spacing:-.005em}
main h3{font-size:15.5px;margin:26px 0 9px}
main h4{font-size:14px;margin:20px 0 7px;color:var(--text-2)}
main p{margin:0 0 13px}
main ul,main ol{margin:0 0 14px;padding-left:22px}
main li{margin:4px 0}
main a{color:var(--accent)}
main hr{border:0;border-top:1px solid var(--line);margin:34px 0}
main strong{font-weight:600}
main code{background:var(--surface-2);padding:1.5px 5px;border-radius:4px;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
main pre{background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
  overflow-x:auto;font-size:12.5px;line-height:1.6}
main pre code{background:none;padding:0;font-size:12.5px}
main blockquote{margin:16px 0;padding:12px 16px;background:var(--surface-1);
  border-left:3px solid var(--quote);border-radius:0 8px 8px 0;color:var(--text-2);font-size:14px}
main blockquote p{margin:0 0 8px}
main blockquote p:last-child{margin:0}
.tablewrap,main table{margin:0 0 18px}
main table{border-collapse:collapse;width:100%;font-size:13.5px;display:block;overflow-x:auto}
main th,main td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
main thead th{background:var(--surface-2);font-weight:600;white-space:nowrap}
main tbody tr:nth-child(even){background:var(--surface-1)}
footer{margin-top:52px;padding-top:18px;border-top:1px solid var(--line);color:var(--text-3);font-size:12.5px;line-height:1.7}
footer a{color:var(--text-2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="sitename" href="./">창업진흥원 근무평정제도 개편 자료</a>
    <button class="ghost" id="themeBtn" title="테마 전환">◐ 테마</button>
  </div>
  <nav class="docnav">
    <a href="./">시뮬레이터</a>
    <a href="diagnosis.html"{% if page.key == "diagnosis" %} class="on"{% endif %}>01 제도 진단</a>
    <a href="amendments.html"{% if page.key == "amendments" %} class="on"{% endif %}>02 규정 개정안</a>
    <a href="benchmark.html"{% if page.key == "benchmark" %} class="on"{% endif %}>03 타기관 비교</a>
    <a href="bargaining.html"{% if page.key == "bargaining" %} class="on"{% endif %}>04 요구사항</a>
    <a href="https://github.com/bigone-kcrew/level">저장소</a>
  </nav>
  <main>
{{ content }}
  </main>
  <footer>
    <p>창업진흥원노동조합 · 문서 <a href="https://creativecommons.org/licenses/by/4.0/deed.ko">CC BY 4.0</a> ·
    코드 MIT · <a href="https://github.com/bigone-kcrew/level">github.com/bigone-kcrew/level</a></p>
    <p>시뮬레이션 수치는 창업진흥원의 실제 평정 결과가 아니며, 제도의 규칙만을 입력하여 산출한 모의 결과입니다.</p>
  </footer>
</div>
<script>
(function(){
  var b=document.getElementById('themeBtn');
  try{var t=localStorage.getItem('kpr-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
  b.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next=cur?(cur==='dark'?'light':'dark'):(dark?'light':'dark');
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('kpr-theme',next);}catch(e){}
  });
})();
</script>
</body>
</html>
