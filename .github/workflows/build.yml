name: 문서·발표덱 자동 빌드

# docs/*.md 나 레이아웃이 바뀌면 .html 을 다시 만들어 커밋한다.
# GitHub Pages 는 main 브랜치 /docs 를 그대로 서비스하므로 별도 배포 설정이 필요 없다.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**.md'
      - 'docs/deck/**'
      - 'tools/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: 변경분 커밋
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "docs: 문서·발표덱 자동 재빌드 [skip ci]"
            git push
          else
            echo "변경 없음"
          fi
