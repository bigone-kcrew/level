<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ — 창업진흥원 근무평정 제도개선</title>
<meta name="description" content="__DESC__">
<meta name="theme-color" content="#FBFAF9">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="compare.css">
<style>
/* 토큰 이름은 발표덱(docs/deck/deck.css)과 같은 체계를 쓴다.
   문서는 오래 읽는 것이므로 밝은 바탕을 기본으로 하고, 시스템 설정이
   어두운 화면이면 자동으로 뒤집는다. 본문 대비는 두 모드 모두 7:1 이상. */
:root{
  color-scheme:light dark;
  --bg:#FBFAF9; --card:#FFFFFF; --card-2:#F4F4F6;
  --bg-2:#F1F1F4;
  --ink:#111114;    /* 18.9:1 */
  --ink-2:#36363C;  /* 12.0:1 */
  --ink-3:#4A4A52;  /*  8.8:1 */
  --hair:rgba(17,17,20,.20); --hair-2:rgba(17,17,20,.09);
  --line:var(--hair-2); --line-2:var(--hair);
  --accent:#005075;      /*  8.7:1 */
  --accent-2:#003F5C;
  --accent-soft:#EAF1F6;
  --brand:var(--accent); --brand-soft:var(--accent-soft);
  --danger:#96201A; --ok:#136B30;
  --series-now:#8C97A8; --series-new:#004D70; --series-hi:#704005;
  --chip-ink:#FFFFFF;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
         "Apple SD Gothic Neo","Noto Sans KR",system-ui,"Malgun Gothic","맑은 고딕",sans-serif;
  --mono:"SF Mono",ui-monospace,"D2Coding",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#0B0B0D; --card-2:#16161A; --bg-2:#16161A;
    --ink:#F5F5F7; --ink-2:#C6C6CC; --ink-3:#A4A4AC;
    --hair:rgba(245,245,247,.16); --hair-2:rgba(245,245,247,.075);
    --accent:#64D2FF; --accent-2:#0A84FF; --accent-soft:rgba(100,210,255,.09);
    --danger:#FF453A; --ok:#30D158;
    --series-now:#6B7C96; --series-new:#64D2FF; --series-hi:#FF9F0A;
    --chip-ink:#00131C;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:100px}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:19px;font-weight:400;line-height:1.76;letter-spacing:-.004em;
  word-break:keep-all;overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-optical-sizing:auto;
}
header{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--card) 82%,transparent);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid var(--hair-2);
}
.hin{max-width:1180px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:18px}
.bm{display:flex;flex-direction:column;padding:11px 0;flex:0 0 auto}
.bm .t{font-size:19px;font-weight:700;letter-spacing:-.018em;white-space:nowrap}
.bm .s{font-size:15.5px;color:var(--ink-3);font-weight:400;letter-spacing:.012em;white-space:nowrap}
nav{display:flex;gap:2px;flex:1 1 0;min-width:0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{
  font-size:16.5px;font-weight:600;color:var(--ink-3);text-decoration:none;
  padding:0 15px;min-height:52px;display:flex;align-items:center;
  border-bottom:3px solid transparent;white-space:nowrap;transition:color .18s,border-color .18s,background .18s;
}
nav a:hover{color:var(--ink);background:var(--card-2)}
nav a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
nav a:focus-visible,.cta:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:2px}
.cta{
  font-size:15px;font-weight:700;color:var(--chip-ink);background:var(--accent);
  text-decoration:none;border-radius:6px;padding:12px 20px;min-height:48px;
  display:flex;align-items:center;white-space:nowrap;flex:0 0 auto;transition:filter .18s;
}
.cta:hover{filter:brightness(1.1)}
main{max-width:1180px;margin:0 auto;padding:38px 22px 96px}
/* 절이 여섯 개를 넘는 문서에는 목차를 붙인다. 폭이 좁으면 목차를 접는다. */
body.has-toc footer{max-width:1420px}
body.has-toc main{max-width:1420px;display:grid;gap:34px;grid-template-columns:minmax(0,1fr) 254px}
.toc{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 130px);overflow-y:auto;
  font-size:15.5px;line-height:1.5;scrollbar-width:thin}
.toc-h{margin:0 0 12px;font-size:15.5px;font-weight:700;color:var(--ink-3);
  letter-spacing:.04em;padding-bottom:10px;border-bottom:1px solid var(--hair-2)}
.toc ol{list-style:none;margin:0;padding:0}
.toc li{margin:0}
.toc a{display:block;padding:8px 10px;min-height:40px;color:var(--ink-3);
  text-decoration:none;border-left:2px solid transparent;border-radius:0 4px 4px 0;
  letter-spacing:-.002em}
.toc a:hover{color:var(--ink);background:var(--card-2)}
.toc li.l2>a{font-weight:600;color:var(--ink-2);margin-top:8px}
.toc li.l3>a{padding-left:22px;font-size:15px}
.toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:700;
  background:var(--accent-soft)}
/* 절 제목 옆의 링크 표시 — 마우스를 올릴 때만 보인다 */
.anchor{margin-left:.4em;color:var(--hair);text-decoration:none;font-weight:400;
  opacity:0;transition:opacity .14s}
h2:hover .anchor,h3:hover .anchor,.anchor:focus-visible{opacity:1;color:var(--accent)}
@media (max-width:1100px){
  body.has-toc main{max-width:1180px;grid-template-columns:minmax(0,1fr)}
  .toc{display:none}
}
article{
  background:var(--card);border:1px solid var(--hair-2);border-radius:6px;
  padding:clamp(24px,4vw,62px);
}
article>*{max-width:80ch}
article>table,article>.tw{max-width:none}
h1,h2,h3,h4{font-weight:700}
h1{font-size:clamp(32px,3.6vw,50px);line-height:1.14;letter-spacing:-.030em;margin:0 0 28px}
h2{font-size:clamp(24px,2.5vw,33px);line-height:1.24;letter-spacing:-.022em;
   margin:58px 0 16px;padding-top:20px;border-top:1px solid var(--hair)}
h2:first-of-type{border-top:0;padding-top:0;margin-top:36px}
h3{font-size:clamp(20px,1.9vw,24px);line-height:1.34;letter-spacing:-.016em;
   margin:36px 0 12px;color:var(--accent)}
h4{font-size:19.5px;line-height:1.44;letter-spacing:-.010em;margin:26px 0 8px}
p{margin:0 0 17px}
ul,ol{margin:0 0 17px;padding-left:26px}
li{margin:6px 0}
blockquote{
  margin:26px 0;padding:18px 24px;background:var(--accent-soft);
  border-left:3px solid var(--accent);border-radius:0;font-size:.97em;
  line-height:1.66;
}
blockquote p:last-child{margin:0}
hr{border:0;border-top:1px solid var(--hair);margin:48px 0}
a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
a:hover{background:var(--accent-soft)}
code{
  font-family:var(--mono);font-size:max(15.5px,.9em);background:var(--card-2);
  border:1px solid var(--hair-2);border-radius:4px;padding:2px 6px;
  letter-spacing:0;
}
pre{
  background:#111114;color:#F5F5F7;border-radius:6px;padding:22px 24px;
  overflow-x:auto;font-size:16px;line-height:1.62;letter-spacing:0;
}
pre code{background:none;border:0;color:inherit;padding:0;font-size:inherit}
.tw{overflow-x:auto;margin:24px 0;border:1px solid var(--hair-2);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:16.5px;background:var(--card)}
th,td{padding:12px 15px;text-align:left;border-bottom:1px solid var(--hair-2);vertical-align:top}
th{background:var(--card-2);font-weight:600;color:var(--ink-3);white-space:nowrap;
   font-size:15.5px;letter-spacing:.03em}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--card-2)}
strong,b{font-weight:700}
/* 하단 메뉴 — 상단 탭에 없는 묶음. 완전히 다른 자리라는 느낌을 준다 */
.footmenu{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  margin:0 0 34px;padding:30px 0 0;border-top:1px solid var(--hair)}
.fg-h{margin:0 0 12px;font-size:16.5px;font-weight:700;color:var(--ink);display:flex;
  flex-direction:column;gap:3px;letter-spacing:-.012em}
.fg-h span{font-size:15.5px;font-weight:400;color:var(--ink-3);letter-spacing:.010em}
.fg-l{display:flex;flex-wrap:wrap;gap:8px}
.fg-l a{display:inline-flex;align-items:center;min-height:48px;padding:0 16px;
  font-size:16px;font-weight:600;text-decoration:none;color:var(--ink-2);
  border:1px solid var(--hair);border-radius:6px;transition:color .16s,border-color .16s,background .16s}
.fg-l a:hover{color:var(--ink);border-color:var(--ink-3);background:var(--card-2)}
.fg-l a.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.fg[data-g="inside"] .fg-h{color:var(--danger)}
.fg[data-g="inside"] .fg-l a{border-style:dashed}
/* 문서 머리의 고지 */
.warn-in,.warn-ap{margin:0 0 30px;padding:16px 20px;border-radius:6px;font-size:16.5px;
  line-height:1.6;border-left:3px solid}
.warn-in{border-left-color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,transparent);
  color:var(--ink)}
.warn-ap{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.fnote{margin:0}
footer{max-width:1180px;margin:0 auto;padding:0 22px 60px;color:var(--ink-3);
  font-size:15.5px;line-height:1.62;letter-spacing:.010em}
@media (max-width:900px){ .cta{display:none} }
@media (max-width:760px){
  body{font-size:17.5px}
  .bm .t{font-size:17px}
  main{padding:22px 14px 70px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition-duration:.001ms!important}}
@media print{
  :root{--bg:#fff;--card:#fff;--card-2:#f4f4f4;--ink:#000;--ink-2:#1a1a1a;--ink-3:#3d3d3d;
        --hair:rgba(0,0,0,.32);--hair-2:rgba(0,0,0,.15);--accent:#004260;--accent-soft:#f2f6f8}
  header,footer .no-print,.cta{display:none!important}
  body{font-size:11.5pt;line-height:1.6}
  article{border:0;padding:0}
  h2{break-after:avoid}
  table,blockquote,pre,.tw{break-inside:avoid}
  pre{background:#f4f4f4;color:#000;border:1px solid #bbb}
  a{color:#000;text-decoration:none}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:.82em;color:#555}
}
</style>
</head>
<body class="doc__BODYCLASS__">
<header><div class="hin">
  <div class="bm">
    <span class="t">근무평정 제도개선(안)</span>
    <span class="s">창업진흥원 노동조합</span>
  </div>
  <nav>__NAV__</nav>
  <a class="cta" href="index.html">발표 화면 열기</a>
</div></header>
<main><article>__BANNER__
__CONTENT__</article>__TOC__</main>
<footer>
<div class="footmenu">__FOOTMENU__</div>
<p class="fnote">창업진흥원 노동조합이 작성한 제안 자료입니다. 확정된 제도가 아닙니다. 규정 인용은 각 기관 ALIO 경영공시 게시본에 따르며 확인 기준일은 2026-09-10입니다.</p>
</footer>
<script>
/* 지금 읽고 있는 절을 목차에서 표시한다.
   화면 위쪽 경계를 지난 마지막 제목을 현재 절로 본다 — 관측 밴드 방식보다
   놓치는 경우가 없다. 목차가 없으면 아무 일도 하지 않는다. */
(function(){
  var toc = document.querySelector('.toc'); if (!toc) return;
  var items = [];
  toc.querySelectorAll('a[href^="#"]').forEach(function(a){
    var el = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
    if (el) items.push({ a: a, el: el });
  });
  if (!items.length) return;

  var cur = null, queued = false;
  function update(){
    queued = false;
    var line = 118;                       // 고정 머리띠 아래 기준선
    var pick = items[0];
    for (var i = 0; i < items.length; i++) {
      if (items[i].el.getBoundingClientRect().top <= line) pick = items[i]; else break;
    }
    // 문서 끝에 닿으면 마지막 절을 현재로 본다
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4)
      pick = items[items.length - 1];
    if (pick.a === cur) return;
    if (cur) cur.classList.remove('on');
    pick.a.classList.add('on'); cur = pick.a;
    var r = pick.a.getBoundingClientRect(), t = toc.getBoundingClientRect();
    if (r.top < t.top || r.bottom > t.bottom) pick.a.scrollIntoView({ block: 'nearest' });
  }
  function onScroll(){ if (!queued) { queued = true; requestAnimationFrame(update); } }
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', onScroll);
  update();
})();
</script>
</body>
