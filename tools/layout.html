<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ — 창업진흥원 근무평정 제도개선</title>
<meta name="description" content="__DESC__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EEF1F6; --card:#FFFFFF; --card-2:#F7F9FC;
  --ink:#0F1A2E; --ink-2:#334155; --ink-3:#475569;
  --line:#D8E0EC; --line-2:#B9C6DA;
  --brand:#1D4ED8; --brand-soft:#E8EEFD;
  --accent:#C2410C; --accent-soft:#FDEBE0;
  --danger:#B91C1C; --ok:#15803D;
  --shadow:0 1px 2px rgba(15,26,46,.06),0 8px 24px rgba(15,26,46,.07);
  --font:'IBM Plex Sans KR','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:19px;font-weight:500;line-height:1.78;-webkit-font-smoothing:antialiased;
}
header{
  position:sticky;top:0;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(15,26,46,.04);
}
.hin{max-width:1180px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.bm{display:flex;flex-direction:column;padding:11px 0}
.bm .t{font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.bm .s{font-size:14px;color:var(--ink-3);font-weight:500;white-space:nowrap}
nav{display:flex;gap:2px;flex:1 1 auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{
  font-size:16px;font-weight:600;color:var(--ink-3);text-decoration:none;
  padding:0 15px;min-height:52px;display:flex;align-items:center;
  border-bottom:3px solid transparent;white-space:nowrap;transition:color .18s,border-color .18s,background .18s;
}
nav a:hover{color:var(--ink);background:var(--card-2)}
nav a.on{color:var(--brand);border-bottom-color:var(--brand)}
nav a:focus-visible,.cta:focus-visible{outline:3px solid var(--brand);outline-offset:-3px}
.cta{
  font-size:15px;font-weight:700;color:#fff;background:var(--brand);text-decoration:none;
  border-radius:999px;padding:11px 20px;white-space:nowrap;transition:filter .18s;
}
.cta:hover{filter:brightness(1.1)}
main{max-width:1180px;margin:0 auto;padding:38px 22px 96px}
article{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:clamp(24px,4vw,58px);
}
article>*{max-width:80ch}
article>table,article>.tw{max-width:none}
h1,h2,h3,h4{letter-spacing:-.022em;line-height:1.3;font-weight:700}
h1{font-size:clamp(30px,3.4vw,44px);margin:0 0 26px}
h2{font-size:clamp(23px,2.4vw,31px);margin:52px 0 16px;padding-top:18px;border-top:2px solid var(--line)}
h2:first-of-type{border-top:0;padding-top:0;margin-top:34px}
h3{font-size:clamp(19px,1.8vw,23px);margin:34px 0 12px;color:var(--brand)}
h4{font-size:19px;margin:24px 0 8px}
p{margin:0 0 17px}
ul,ol{margin:0 0 17px;padding-left:26px}
li{margin:6px 0}
blockquote{
  margin:24px 0;padding:18px 22px;background:var(--brand-soft);
  border-left:5px solid var(--brand);border-radius:0 10px 10px 0;font-size:.97em;
}
blockquote p:last-child{margin:0}
hr{border:0;border-top:2px solid var(--line);margin:44px 0}
a{color:var(--brand);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
a:hover{background:var(--brand-soft)}
code{
  font-family:var(--mono);font-size:.9em;background:var(--card-2);
  border:1px solid var(--line);border-radius:5px;padding:2px 6px;
}
pre{
  background:#0F1A2E;color:#E8EEFD;border-radius:12px;padding:20px 22px;
  overflow-x:auto;font-size:16px;line-height:1.6;
}
pre code{background:none;border:0;color:inherit;padding:0;font-size:inherit}
.tw{overflow-x:auto;margin:22px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:16.5px;background:var(--card)}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--card-2);font-weight:700;color:var(--ink-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--card-2)}
strong,b{font-weight:700}
footer{max-width:1180px;margin:0 auto;padding:0 22px 60px;color:var(--ink-3);font-size:15px}
@media (max-width:760px){
  body{font-size:17.5px}
  .bm .t{font-size:17px}
  main{padding:22px 14px 70px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition-duration:.001ms!important}}
</style>
</head>
<body>
<header><div class="hin">
  <div class="bm">
    <span class="t">근무평정 제도개선(안)</span>
    <span class="s">창업진흥원 노동조합</span>
  </div>
  <nav>__NAV__</nav>
  <a class="cta" href="index.html">발표 화면 열기</a>
</div></header>
<main><article>__CONTENT__</article></main>
<footer>창업진흥원 노동조합이 작성한 제안 자료입니다. 확정된 제도가 아닙니다. 규정 인용은 각 기관 ALIO 경영공시 게시본에 따르며 확인 기준일은 2026-09-10입니다.</footer>
</body>
</html>
